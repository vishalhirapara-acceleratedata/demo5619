name: 'sales_mart'
version: '1.0.0'
config-version: 2

profile: "{{ env_var('DBT_PROFILE_NAME', 'default') }}"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  sales_mart:
    staging:
      +materialized: view
      +access: protected
    marts:
      +materialized: table
      +access: public
