version: 2

models:
  - name: stg_orders
    description: >
      Staged order line items. One row per product line within an order; a single order_id
      may appear on multiple rows when the customer purchased more than one product.
      Reads the orders seed and applies explicit type casts; no filters, joins or aggregations.
    access: protected
    columns:
      - name: order_id
        description: Unique identifier for the order. Shared across multiple rows for multi-line orders.
        tests:
          - not_null
      - name: order_date
        description: Date the order was placed, cast to DATE.
        tests:
          - not_null
      - name: customer_id
        description: Unique identifier for the customer who placed the order.
        tests:
          - not_null
      - name: customer_name
        description: Full name of the customer.
        tests:
          - not_null
      - name: product_id
        description: Unique identifier for the product on this line item.
        tests:
          - not_null
      - name: product_name
        description: Display name of the product purchased on this line item.
        tests:
          - not_null
      - name: category
        description: Product category (e.g. Electronics, Furniture, Apparel).
        tests:
          - not_null
      - name: quantity
        description: Number of units of this product ordered, cast to INTEGER.
        tests:
          - not_null
      - name: unit_price
        description: Price per unit of the product in USD at the time of order, cast to DECIMAL(10,2).
        tests:
          - not_null
      - name: order_status
        description: >
          Current fulfilment status of the order.
          One of: completed, shipped, processing, cancelled.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [completed, shipped, processing, cancelled]
